<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Pet - Editar Reserva</title>
  <link rel="stylesheet" href="styles.css">
  <script src="js/navegacao.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/formularios.js" defer></script>
</head>
<body>

  <div class="app-container">

    <!-- Sidebar / Menu Lateral -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">Hotel Pet</div>
      <ul class="sidebar-nav">
        <li><a href="index.html">Pets</a></li>
        <li><a href="listagem_usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="listagem_reservas.html" class="active">Reservas</a></li>
        <li><a href="login.html">Sair</a></li>
      </ul>
    </aside>

    <!-- Header / Cabeçalho Superior -->
    <header class="app-header">
      <div class="header-user">
        <a href="editor_perfil.html">
          <img src="perfil_gerente.png" alt="Foto do Gerente" class="avatar">
          <span>João da Silva</span>
        </a>
      </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="app-main">
      <nav class="breadcrumb">Home / Reservas / Editar Reserva</nav>

      <section class="painel">
        <h2 class="page-title">Editar reserva</h2>
        <div class="form-wrap">
          <form data-colecao="reservas" data-modo="editar" action="listagem_reservas.html" method="get" enctype="multipart/form-data">
          <div class="form-group">
            <label for="proprietario">Proprietário *</label>
            <input type="text" id="proprietario" name="proprietarioNome" class="form-control" required readonly>
          </div>
          <div class="form-group">
            <label for="pet">Pet *</label>
            <input type="text" id="pet" name="petNome" class="form-control" required readonly>
          </div>
          <div class="form-group">
            <label for="inicio">Período *</label>
            <div class="periodo">
              <input type="date" id="inicio" name="chegada" class="form-control" required aria-label="Chegada">
              <input type="date" id="fim" name="partida" class="form-control" required aria-label="Partida">
            </div>
          </div>
          <div class="form-group">
            <label for="notas">Notas</label>
            <textarea id="notas" name="notas" rows="4" class="form-control" placeholder=""></textarea>
          </div>
          <div class="form-group">
            <label for="status">Status *</label>
            <select id="status" name="status" class="form-control" required><option value="Reservada">Reservada</option><option value="Em progresso">Em progresso</option><option value="Finalizada">Finalizada</option></select>
          </div>
          <div class="form-group">
            <label for="anotacoes_funcionarios">Anotações do funcionário</label>
            <textarea id="anotacoes_funcionarios" name="anotacoes_funcionarios" rows="4" class="form-control" placeholder=""></textarea>
          </div>
          <div class="form-group">
            <label>Imagens</label>
            <div class="thumbs" id="galeria">
              <label for="imagens" class="thumb thumb-add" title="Adicionar imagens">+</label>
            </div>
            <input type="file" id="imagens" name="imagens" multiple accept="image/*" class="visually-hidden">
            <span class="dica" id="imagens-selecionadas"></span>
          </div>

          <div class="total-diarias">Total das diárias: <strong id="total-diarias">R$ 0,00</strong><span class="dica" id="dica-diaria"></span></div>

          <div id="bloco-recibo" hidden>
            <label for="recibo" class="btn btn-roxo btn-sm ico-doc" style="margin-top: 14px;">Adicionar nota fiscal</label>
            <input type="file" id="recibo" name="recibo" accept=".pdf,image/*" class="visually-hidden">
            <span class="dica" id="recibo-selecionado"></span>
            <div><a href="#" target="_blank" class="link-anexo ico-clip" id="link-recibo" hidden>recibo</a></div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary ico-save">Salvar</button>
            <button type="reset" class="btn ico-reset">Limpar</button>
          </div>
          </form>
        </div>
      </section>
    </main>

  </div>

</body>
</html>
